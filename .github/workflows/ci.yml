name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check SSH key fingerprint
        run: |
          (ssh-keygen -l -f ssh_keys/id_ed25519.pub | awk '{print $2}') > tmp.txt
          diff -b tmp.txt ssh_keys/id_ed25519_fingerprint.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cpplint
        run: pip install cpplint

      - name: Run cpplint on task5.cpp
        run: cpplint task5.cpp